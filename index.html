<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKCT 연습</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; background: #fff; color: #111; }
  html { background: #fff; }
  button { font: inherit; padding: 10px 16px; margin: 4px 4px 4px 0; cursor: pointer; touch-action: manipulation; }
  fieldset { margin: 16px 0; border: 1px solid #ccc; border-radius: 8px; min-width: 0; }
  label { display: block; padding: 10px 0; cursor: pointer; touch-action: manipulation; } /* 손가락으로 누르기 쉬운 높이 */
  input[type=radio] { width: 1.2em; height: 1.2em; vertical-align: text-bottom; }
  table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; max-width: 100%; } /* 좁은 화면(스플릿 뷰)에서 표만 가로 스크롤 */
  th, td { border: 1px solid #999; padding: 4px 10px; text-align: center; }
  #bar { position: sticky; top: 0; background: #fff; padding: 8px 0; border-bottom: 2px solid #333; display: flex; justify-content: space-between; }
  .ok { color: #0a7a2f; } .no { color: #c22; }
  .guess { color: #666; border-top: 1px dashed #ccc; margin-top: 4px; }
  #tools { position: fixed; right: 8px; top: 64px; width: 250px; display: grid; gap: 6px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 8px; }
  #tools[hidden] { display: none; }
  #tools input, #tools textarea { font: inherit; width: 100%; box-sizing: border-box; }
  @media (max-width: 1340px) { #tools { position: static; width: auto; margin-top: 16px; } } /* 옆 공간이 없으면 문제 아래로 */
</style>
<main id="app"></main>
<!-- 실전 프로그램에도 화면 안 계산기와 메모장이 있다(종이·펜은 금지). 문제마다 비운다 -->
<aside id="tools" hidden>
  <b>계산기</b>
  <input id="calc" autocomplete="off" placeholder="예: (8*300+12*200)/500" aria-label="계산기 식 입력">
  <output id="res" for="calc">&nbsp;</output>
  <b>메모장</b>
  <textarea id="memo" rows="8" aria-label="메모장"></textarea>
</aside>
<script src="questions.js"></script>
<script>
const app = document.getElementById('app');
const NUM = '①②③④⑤';
// SKCT 인지검사(전임직) 공식 시간표: 영역 → [문항 수, 제한 시간(초)]. 출처: 응시자 안내사항 4쪽
const CONF = { '언어표현': [30, 180], '언어이해': [20, 420], '창의수리': [30, 900], '자료해석': [20, 600] };
const AREAS = Object.keys(CONF);
const TOTAL = sum(AREAS.map(a => CONF[a][0])), TOTAL_MIN = sum(AREAS.map(a => CONF[a][1])) / 60;
let timer;

const qHtml = (q, i, guessBox) => `<fieldset><legend>문제 ${i + 1}</legend><div>${q.q}</div>` +
  q.choices.map((c, j) => `<label><input type="radio" name="q${i}" value="${j}"> ${NUM[j]} ${c}</label>`).join('') +
  (guessBox ? `<label class="guess"><input type="checkbox" name="g${i}"> 찍음</label>` : '') + `</fieldset>`;
const ansHtml = q => `정답: ${NUM[q.answer]} ${q.choices[q.answer]}<br>해설: ${q.explain}`;

// 통계: 이 기기 브라우저(localStorage)에만 저장. { "영역|유형": {r 맞힌 수, n 푼 수, s 걸린 초 합, k 시간 잰 횟수} }
const KEY = 'skct-stats';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
function record(q, ok, sec) {
  const s = load(), v = s[q.area + '|' + typeOf(q)] ||= { r: 0, n: 0, s: 0, k: 0 };
  v.n++; if (ok) v.r++;
  if (sec != null) { v.s += sec; v.k++; }
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} // 사생활 보호 모드 등에서 저장이 막혀도 풀이는 계속
}
// 찍어서 맞힌 문제를 통계에서 틀린 것으로 되돌린다
function demote(q) {
  const s = load(), v = s[q.area + '|' + typeOf(q)];
  if (v && v.r > 0) v.r--;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
}
function statsHtml() {
  // 예전(기술사무직 구성) 기록의 언어추리·수열추리는 지금 시험에 없으므로 숨긴다
  const rows = Object.entries(load()).map(([k, v]) => [...k.split('|'), v]).filter(x => AREAS.includes(x[0]));
  if (!rows.length) return '<p>아직 기록이 없습니다.</p>';
  const pct = (r, n) => Math.round(r / n * 100) + '%';
  const areas = AREAS.map(a => { const vs = rows.filter(x => x[0] === a).map(x => x[2]); return [a, sum(vs.map(v => v.r)), sum(vs.map(v => v.n))]; }).filter(x => x[2]);
  return T(['영역', '정답률', '맞힘 / 푼 수'], areas.map(([a, r, n]) => [a, pct(r, n), `${r} / ${n}`])) +
    '<p>유형별(정답률 낮은 순). 평균 시간은 익숙해지기에서 잰 값입니다.</p>' +
    T(['영역', '유형', '정답률', '맞힘 / 푼 수', '평균 시간'], rows.sort((x, y) => x[2].r / x[2].n - y[2].r / y[2].n)
      .map(([a, t, v]) => [a, t, pct(v.r, v.n), `${v.r} / ${v.n}`, v.k ? Math.round(v.s / v.k) + '초' : '-']));
}

const calcEl = document.getElementById('calc'), res = document.getElementById('res'); // calc는 questions.js의 연산 출제기 이름
calcEl.oninput = () => {
  const s = calcEl.value.replace(/×/g, '*').replace(/÷/g, '/');
  let v = '';
  if (/^[\d+\-*/().\s]+$/.test(s)) try { v = +Function(`"use strict"; return (${s})`)().toFixed(6); } catch {} // 숫자·사칙연산·괄호만 계산
  res.textContent = v === '' || !isFinite(v) ? ' ' : '= ' + v.toLocaleString('ko-KR', { maximumFractionDigits: 6 });
};
function tools(on) {
  document.getElementById('tools').hidden = !on;
  calcEl.value = document.getElementById('memo').value = '';
  res.textContent = ' ';
}

function home() {
  clearInterval(timer);
  document.onkeydown = null;
  tools(false);
  app.innerHTML = `<h1>SKCT 연습 (전임직)</h1>
    <p>인지검사 4개 영역, ${TOTAL}문항 ${TOTAL_MIN}분 구성입니다. 문제를 풀 때 화면에 계산기와 메모장이 나옵니다. 실전처럼 종이와 펜 없이 푸세요.</p>
    <h2>1. 익숙해지기</h2><p>유형을 섞어 한 문제씩 풉니다. 답을 고르면 바로 정답과 해설, 걸린 시간이 나옵니다. 숫자 키 1~5로 답하고 Enter로 다음 문제. 모르면 찍지 말고 "모르겠음"(0 키)을, 찍어서 맞혔으면 "찍어서 맞힘"을 누르면 틀린 것으로 기록됩니다.</p><button id="drill">시작</button>
    <h2>2. 영역별 연습</h2><p>실전처럼 한 문제씩 나오고, 넘긴 문제로는 되돌아갈 수 없습니다. 시간이 끝나면 자동 종료됩니다.</p>${AREAS.map(a => `<button data-a="${a}">${a} (${CONF[a][0]}문항 ${CONF[a][1] / 60}분)</button>`).join('')}
    <h2>3. 실전 모의고사</h2><p>4개 영역을 이어서 봅니다(${TOTAL}문항 ${TOTAL_MIN}분). 점수와 해설은 전부 끝난 뒤에 나옵니다.</p><button id="mock">시작</button>
    <h2>4. 내 기록</h2><p>세 모드에서 푼 문제가 모두 집계됩니다. 안 푼 문제와 "찍음"으로 표시한 문제는 틀린 것으로 셉니다. 기록은 이 기기에만 저장됩니다.</p>${statsHtml()}<button id="reset">기록 지우기</button>`;
  document.getElementById('reset').onclick = () => { if (confirm('기록을 모두 지울까요? 되돌릴 수 없습니다.')) { localStorage.removeItem(KEY); home(); } };
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => start(b.dataset.a));
  document.getElementById('drill').onclick = drill;
  document.getElementById('mock').onclick = mock;
}

// 출제기가 있는 영역은 고정 문제 최대 2개 + 자동 출제, 없는 영역(언어이해)은 고정 문제만
function build(area) {
  const gens = GEN[area] || [], count = CONF[area][0];
  const qs = shuffle(QUESTIONS.filter(q => q.area === area)).slice(0, gens.length ? 2 : count);
  const seen = new Set(qs.map(q => q.q));
  for (let guard = 0; gens.length && qs.length < count && guard < 500; guard++) {
    const q = gen(area);
    if (!seen.has(q.q)) { seen.add(q.q); qs.push(q); }
  }
  qs.forEach(q => console.assert(new Set(q.choices).size === 5 && q.answer >= 0 && q.answer < 5, '문제 형식 오류', q));
  return shuffle(qs);
}

// 실전 규칙대로 한 문제씩 보여 주고 이전 문항으로는 못 돌아간다.
// done이 있으면(모의고사) 채점 결과를 화면에 띄우지 않고 done(점수, 해설HTML)으로 넘긴다
function start(area, done, title = area) {
  const qs = build(area), mine = [], guessed = [];
  const end = Date.now() + CONF[area][1] * 1000; // 마감 시각 기준: 탭이 백그라운드로 가서 타이머가 멈춰도 시간이 맞게
  let i = 0;
  const save = () => {
    const fd = new FormData(app.querySelector('form')), v = fd.get('q' + i);
    mine[i] = v === null ? null : +v;
    guessed[i] = fd.has('g' + i);
  };
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    document.getElementById('t').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (!left) { save(); grade(); }
  };
  const show = () => {
    const last = i === qs.length - 1;
    app.innerHTML = `<div id="bar"><b>${title} ${i + 1} / ${qs.length}</b><span id="t" role="timer"></span></div><form>${qHtml(qs[i], i, true)}` +
      `<button>${last ? (done ? '영역 종료하고 다음으로' : '종료') : '다음 문제 (되돌아갈 수 없음)'}</button></form>`;
    app.querySelector('form').onsubmit = e => { e.preventDefault(); save(); if (++i < qs.length) show(); else grade(); };
    tools(true);
    tick();
    scrollTo(0, 0);
  };
  const grade = () => {
    clearInterval(timer);
    tools(false);
    let score = 0;
    const body = qs.map((q, k) => {
      const m = mine[k] ?? null, ok = m === q.answer;
      if (ok) score++;
      record(q, ok && !guessed[k]); // 찍은 문제는 점수는 그대로 두고 통계에서만 틀린 것으로 센다
      return `<fieldset><legend class="${ok ? 'ok' : 'no'}">문제 ${k + 1} ${ok ? '정답' : '오답'}${guessed[k] ? ' (찍음)' : ''}</legend><div>${q.q}</div>` +
        `<p>내 답: ${m === null ? '안 풂' : NUM[m] + ' ' + q.choices[m]}<br>${ansHtml(q)}</p></fieldset>`;
    }).join('');
    scrollTo(0, 0);
    if (done) return done(score, body);
    app.innerHTML = `<h1>${area}: ${score} / ${qs.length}</h1>${body}<button id="home">처음으로</button>`;
    document.getElementById('home').onclick = home;
  };
  timer = setInterval(tick, 1000);
  show();
}

function mock() {
  const res = [];
  const step = i => {
    if (i < AREAS.length) return start(AREAS[i], (score, body) => { res.push({ score, body }); step(i + 1); }, `${i + 1}/${AREAS.length} ${AREAS[i]}`);
    app.innerHTML = `<h1>모의고사: ${sum(res.map(r => r.score))} / ${TOTAL}</h1>` +
      res.map((r, k) => `<details><summary>${AREAS[k]}: ${r.score} / ${CONF[AREAS[k]][0]} (해설 보기)</summary>${r.body}</details>`).join('') +
      `<button id="home">처음으로</button>`;
    document.getElementById('home').onclick = home;
  };
  step(0);
}

function drill() {
  const fixed = {}; // 영역별 고정 문제 대기열: 다 쓸 때까지 같은 지문이 다시 안 나오게
  const one = area => {
    const gens = GEN[area] || [];
    if (gens.length && Math.random() < 0.9) return gen(area);
    if (!fixed[area]?.length) fixed[area] = shuffle(QUESTIONS.filter(q => q.area === area));
    return fixed[area].pop() || gen(area); // 고정 문제가 없는 영역은 출제기로
  };
  let n = 0, right = 0;
  const next = () => {
    const q = one(pick(AREAS)), t0 = Date.now(), limit = Math.round(CONF[q.area][1] / CONF[q.area][0]); // 실전 문항당 시간
    let answered = false;
    app.innerHTML = `<div id="bar"><b>${q.area}</b><span>맞힌 수 ${right} / ${n}</span></div>${qHtml(q, n)}<div id="fb" aria-live="polite"><button id="idk">모르겠음</button></div><button id="home">그만하기</button>`;
    document.getElementById('home').onclick = home;
    document.getElementById('idk').onclick = () => answer(-1);
    const inputs = [...app.querySelectorAll('input')];
    const answer = j => {
      if (answered) return;
      answered = true;
      const sec = Math.round((Date.now() - t0) / 1000), ok = j === q.answer;
      n++; if (ok) right++;
      record(q, ok, sec);
      inputs.forEach(el => el.disabled = true);
      if (j >= 0) inputs[j].checked = true;
      document.getElementById('fb').innerHTML = `<p><b class="${ok ? 'ok' : 'no'}">${ok ? '정답' : j < 0 ? '모르겠음' : '오답'}</b> · ${sec}초 걸림${sec > limit ? ` (실전 기준 ${limit}초 초과)` : ''}<br>${ansHtml(q)}</p><button id="next">다음 문제</button>${ok ? '<button id="guess">찍어서 맞힘</button>' : ''}`;
      if (ok) document.getElementById('guess').onclick = e => {
        demote(q); right--;
        app.querySelector('#bar span').textContent = `맞힌 수 ${right} / ${n}`;
        e.target.replaceWith('찍음으로 기록했습니다.');
        b.focus();
      };
      const b = document.getElementById('next');
      b.onclick = next;
      b.focus(); // Enter로 바로 다음 문제
    };
    inputs.forEach((el, j) => el.onchange = () => answer(j));
    // 0 = 모르겠음. 계산기·메모장에 숫자를 칠 때는 답으로 처리하지 않는다
    document.onkeydown = e => { if (/^[0-5]$/.test(e.key) && !e.target.closest('#tools')) answer(e.key - 1); };
    tools(true);
    scrollTo(0, 0);
  };
  next();
}

home();
</script>
</html>
