<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKCT 연습</title>
<script src="theme.js?v=1"></script>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; background: #fff; color: #111; }
  html { background: #fff; -webkit-text-size-adjust: 100%; } /* 아이폰을 가로로 돌려도 글자가 커지지 않게 */
  button { font: inherit; padding: 10px 16px; margin: 4px 4px 4px 0; cursor: pointer; touch-action: manipulation; }
  fieldset { margin: 16px 0; border: 1px solid #ccc; border-radius: 8px; min-width: 0; }
  label { display: block; padding: 10px 0; cursor: pointer; touch-action: manipulation; } /* 손가락으로 누르기 쉬운 높이 */
  input[type=radio] { width: 1.2em; height: 1.2em; vertical-align: text-bottom; }
  input[type=password] { font: inherit; padding: 8px; max-width: 100%; box-sizing: border-box; }
  table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; max-width: 100%; } /* 좁은 화면(스플릿 뷰)에서 표만 가로 스크롤 */
  th, td { border: 1px solid #999; padding: 4px 10px; text-align: center; }
  #bar { position: sticky; top: 0; background: #fff; padding: 8px 0; border-bottom: 2px solid #333; display: flex; flex-wrap: wrap; gap: 0 12px; justify-content: space-between; }
  #bar > * { white-space: nowrap; } /* 좁으면 낱말 중간이 아니라 항목 단위로 줄을 바꾼다 */
  .ok { color: #0a7a2f; } .no { color: #c22; }
  .guess { color: #666; border-top: 1px dashed #ccc; margin-top: 4px; }
  #tools { position: fixed; right: 8px; top: 64px; width: 236px; /* 아이패드 12.9 가로(1366px)에서 본문과 겹치지 않는 폭 */ display: grid; gap: 6px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 8px; }
  #tools[hidden] { display: none; }
  #t, #swt { font-variant-numeric: tabular-nums; }
  /* 문제별 남은 시간 원: 글자 폭이 변하지 않아 막대 줄바꿈으로 보기가 밀리지 않는다 */
  #sw { display: inline-block; width: 1.5em; height: 1.5em; box-sizing: border-box; border: 2px solid #333; border-radius: 50%; vertical-align: middle; }
  #bar button { margin: 0; padding: 0 10px; font-size: .9em; }
  .paused #app > :not(#bar), .paused #tools { display: none; }
  .chat { border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 4px; }
  .chat p { white-space: pre-wrap; margin: 8px 0; }
  .chat .me::before { content: '나: '; font-weight: bold; }
  .chat .ai::before { content: '선생님: '; font-weight: bold; }
  .chat textarea { display: block; width: 100%; box-sizing: border-box; font: inherit; }
  .chat small { color: #666; }
  .code { color: #666; font-size: .85em; user-select: all; -webkit-user-select: all; } /* 한 번 누르면 코드 전체가 선택된다 */
  .paused #app::after { content: '일시 정지 중입니다. 계속하기를 누르면 이어서 풉니다.'; display: block; padding: 24px 0; }
  #pad { width: 100%; border: 1px solid #ccc; background: #fff; cursor: crosshair; touch-action: none; }
  #erase { padding: 2px 10px; margin: 0 0 0 6px; font-size: .8em; }
  #res { display: block; text-align: right; border: 1px solid #ccc; padding: 6px; min-height: 1.6em; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
  #keys button { margin: 0; padding: 8px 0; }
  @media (max-width: 1340px) { #tools { position: static; width: auto; margin-top: 16px; } } /* 옆 공간이 없으면 문제 아래로 */
  @media (max-width: 600px) { /* 아이폰 세로: 여백과 표 글자를 줄여 자료해석 표가 화면 폭에 들어오게 */
    body { font-size: 17px; padding: 10px 12px; }
    #bar { font-size: 15px; }
    fieldset { margin: 10px 0; padding: 6px 10px; }
    table { font-size: 15px; }
    th, td { padding: 3px 6px; }
  }
  /* 어두운 화면(오른쪽 아래 버튼, theme.js). 밝은 화면 규칙은 그대로 두고 덮어쓴다 */
  :root[data-theme=dark] { color-scheme: dark; --track: #3a3e44; --ok: #5ccf86; --no: #ff7b72; }
  :root[data-theme=dark], :root[data-theme=dark] body, :root[data-theme=dark] #bar, :root[data-theme=dark] #tools, :root[data-theme=dark] #pad { background: #1b1d21; }
  :root[data-theme=dark] body { color: #d9dce1; }
  :root[data-theme=dark] a { color: #8ab4f8; }
  :root[data-theme=dark] fieldset, :root[data-theme=dark] th, :root[data-theme=dark] td, :root[data-theme=dark] #tools, :root[data-theme=dark] #pad, :root[data-theme=dark] #res, :root[data-theme=dark] .guess, :root[data-theme=dark] .chat { border-color: #4a4f57; }
  :root[data-theme=dark] #bar, :root[data-theme=dark] #sw { border-color: #8a9099; }
  body:has(#bar) #theme-toggle { display: none; } /* 시간 재는 화면에서는 버튼이 보기나 계산기를 가리지 않게 숨긴다. 처음 화면에서 바꾼다 */
  :root[data-theme=dark] .ok { color: #5ccf86; } :root[data-theme=dark] .no { color: #ff7b72; }
  :root[data-theme=dark] .guess, :root[data-theme=dark] .chat small, :root[data-theme=dark] .code { color: #a2a8b0; }
</style>
<main id="app"></main>
<!-- 실전 프로그램에도 화면 안 계산기와 그림판이 있다(종이·펜은 금지). 문제마다 비운다 -->
<aside id="tools" hidden>
  <b>계산기</b>
  <div id="calc" tabindex="0" aria-label="계산기. 클릭한 뒤 키보드로도 입력할 수 있습니다"><output id="res">0</output><div id="keys"></div></div>
  <div><b>그림판</b> <button id="erase" type="button">지우기</button></div>
  <canvas id="pad" width="500" height="380" aria-label="그림판. 마우스로 끌어서 씁니다"></canvas>
</aside>
<!-- ?v=: 배포 뒤 새 페이지가 캐시에 남은 옛 스크립트와 섞여 빈 화면이 되지 않게, 고칠 때마다 올린다 -->
<script src="questions.js?v=9"></script>
<script src="bank-data.js?v=5"></script>
<script src="store.js?v=7"></script>
<script src="visit.js?v=3"></script>
<script>
const app = document.getElementById('app');
const NUM = '①②③④⑤';
// SKCT 인지검사(전임직) 공식 시간표: 영역 → [문항 수, 제한 시간(초)]. 출처: 응시자 안내사항 4쪽
const CONF = { '언어표현': [30, 180], '언어이해': [20, 420], '창의수리': [30, 900], '자료해석': [20, 600] };
const AREAS = Object.keys(CONF);
const TOTAL = sum(AREAS.map(a => CONF[a][0])), TOTAL_MIN = sum(AREAS.map(a => CONF[a][1])) / 60;
let timer, sw;

// 일시 정지: 멈춘 동안은 시계가 가지 않는다. 문제별 초시계와 영역 마감 시각 모두 now()로 재서 함께 멈춘다
let pausedAt = 0, pausedTotal = 0;
const now = () => (pausedAt || Date.now()) - pausedTotal;
function setPause(on) {
  if (!on && pausedAt) { pausedTotal += Date.now() - pausedAt; pausedAt = 0; }
  if (on && !pausedAt) pausedAt = Date.now();
  document.body.classList.toggle('paused', on); // 멈춘 동안 문제와 계산기를 가린다
  const b = document.getElementById('pause');
  if (b) b.textContent = on ? '계속하기' : '일시 정지';
}

// 문제별 초시계: 실전 문항당 시간이 꽉 찬 원으로 시작해 줄어든다. 넘기면 빨간 원이 된다.
// 돌려주는 함수를 부르면 멈추고 걸린 초를 알려 준다. 초기화 버튼은 이 문제 시간만 0초부터 다시 센다(영역 제한 시간은 그대로)
// already: 이미 쓴 초. 실수로 누른 답을 무르고 다시 풀 때 앞서 쓴 시간에 이어서 센다
const CLOCK = '<span>이 문제 <i id="sw" aria-hidden="true"></i> <span id="swt"></span></span><button type="button" id="swreset">초기화</button><button type="button" id="pause">일시 정지</button>';
function stopwatch(area, already = 0) {
  clearInterval(sw);
  let t0 = now() - already * 1000, running = true;
  const limit = CONF[area][1] / CONF[area][0], el = document.getElementById('sw'), txt = document.getElementById('swt');
  document.getElementById('pause').onclick = () => setPause(!pausedAt);
  document.getElementById('swreset').onclick = () => { if (running) { t0 = now(); draw(); } }; // 답한 뒤에는 이미 기록한 시간이라 바꾸지 않는다
  const draw = () => {
    const s = (now() - t0) / 1000, over = s > limit;
    el.style.background = over ? 'var(--no, #c22)' : `conic-gradient(var(--ok, #0a7a2f) ${(1 - s / limit) * 360}deg, var(--track, #e5e5e5) 0)`;
    // 숫자 폭 공백(U+2007)으로 두 자리를 맞춘다. 10초→9초에서 글자 폭이 줄면 막대 줄바꿈이 바뀌어 보기가 밀린다
    txt.textContent = `${String(Math.ceil(over ? s - limit : limit - s)).padStart(2, ' ')}초 ${over ? '초과' : '남음'}`;
    txt.className = over ? 'no' : '';
  };
  draw();
  sw = setInterval(draw, 100);
  return () => { clearInterval(sw); running = false; return Math.round((now() - t0) / 100) / 10; };
}
// 문제 은행(bank-data.js): 사람이 쓰고 두 번씩 풀어 검증한 고정 문제
if (typeof BANK !== 'undefined') QUESTIONS.push(...BANK);
// 고정 문제는 페이지를 열 때마다 보기 순서를 섞어 정답 자리를 고르게 한다(해설은 보기 번호를 쓰지 않는다).
// 순서가 있는 보기는 실전처럼 그대로 둔다: 작은 순으로 놓인 짧은 숫자 보기("약 20%", "1,250명")와 ㉠~㉤ 같은 짧은 기호 차례(문장 삽입 자리)
const ordered = cs => {
  const t = cs.map(c => c.replace(/<[^>]*>|,/g, '').trim());
  if (t.every(c => c.length <= 3) && t.every((c, i) => !i || t[i - 1] < c)) return true;
  const v = t.map(c => c.length <= 20 ? parseFloat(c.match(/-?\d+(\.\d+)?/)?.[0]) : NaN);
  return v.every((x, i) => !isNaN(x) && (!i || v[i - 1] < x));
};
for (const q of QUESTIONS) {
  if (ordered(q.choices)) continue;
  const right = q.choices[q.answer];
  q.choices = shuffle(q.choices);
  q.answer = q.choices.indexOf(right);
}

const qHtml = (q, i, guessBox) => `<fieldset><legend>문제 ${i + 1}</legend><div>${q.q}</div>` +
  q.choices.map((c, j) => `<label><input type="radio" name="q${i}" value="${j}"> ${NUM[j]} ${c}</label>`).join('') +
  (guessBox ? `<label class="guess"><input type="checkbox" name="g${i}"> 찍음</label>` : '') + `</fieldset>`;
const ansHtml = q => `정답: ${NUM[q.answer]} ${q.choices[q.answer]}<br>해설: ${q.explain}`;

// 통계: 서버 기록(store.js)에, 서버 저장을 붙이기 전 이 기기에만 쌓였던 예전 집계(skct-stats)를 더해 보여 준다
const KEY = 'skct-stats';
function allStats() {
  const out = store.stats();
  for (const [k, v] of Object.entries(ls.get(KEY, {}))) { const o = out[k] ||= { r: 0, n: 0, s: 0, k: 0 }; for (const f of 'rnsk') o[f] += +v[f] || 0; }
  return out;
}
function statsHtml() {
  // 예전(기술사무직 구성) 기록의 언어추리·수열추리는 지금 시험에 없으므로 숨긴다
  const rows = Object.entries(allStats()).map(([k, v]) => [...k.split('|'), v]).filter(x => AREAS.includes(x[0]));
  if (!rows.length) return '<p>아직 기록이 없습니다.</p>';
  const pct = (r, n) => Math.round(r / n * 100) + '%';
  const areas = AREAS.map(a => { const vs = rows.filter(x => x[0] === a).map(x => x[2]); return [a, sum(vs.map(v => v.r)), sum(vs.map(v => v.n))]; }).filter(x => x[2]);
  return T(['영역', '정답률', '맞힘 / 푼 수'], areas.map(([a, r, n]) => [a, pct(r, n), `${r} / ${n}`])) +
    '<p>유형별(정답률 낮은 순). 평균 시간은 문제마다 잰 초시계 값이고, 실전 문항당 시간을 넘으면 빨갛게 표시됩니다.</p>' +
    T(['영역', '유형', '정답률', '맞힘 / 푼 수', '평균 시간 / 목표'], rows.sort((x, y) => x[2].r / x[2].n - y[2].r / y[2].n)
      .map(([a, t, v]) => { const lim = CONF[a][1] / CONF[a][0], avg = v.k ? v.s / v.k : 0;
        return [a, esc(t), pct(v.r, v.n), `${v.r} / ${v.n}`, v.k ? `<span class="${avg > lim ? 'no' : ''}">${avg.toFixed(1)}초</span> / ${lim}초` : '-']; }));
}

// 실전 프로그램의 계산기처럼: 괄호 없음, 사칙연산과 루트만, 누르는 순서대로 계산(2 + 3 × 4 = 20)
const res = document.getElementById('res'), keys = document.getElementById('keys');
const OPS = { '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b, '÷': (a, b) => a / b };
const num = v => String(+v.toFixed(8));
let cur, acc, op, fresh; // cur 입력 중인 수(문자열), acc 누적값, op 대기 중인 연산, fresh 다음 숫자가 새 수의 시작인지
function press(k) {
  if (/[\d.]/.test(k)) {
    if (fresh) { cur = ''; fresh = false; }
    if (k !== '.') cur += k; else if (!cur.includes('.')) cur += cur ? '.' : '0.';
  }
  else if (k in OPS) { acc = op && !fresh ? OPS[op](acc, +cur) : +cur; op = k; cur = num(acc); fresh = true; }
  else if (k === '=') { if (op) { acc = OPS[op](acc, +cur); cur = num(acc); op = null; fresh = true; } }
  else if (k === '√') { cur = num(Math.sqrt(+cur)); fresh = true; }
  else if (k === '←') { if (!fresh) cur = cur.slice(0, -1); }
  else { cur = '0'; acc = op = null; fresh = true; } // C
  res.textContent = op ? `${num(acc)} ${op} ${fresh ? '' : cur}` : cur || '0';
}
keys.innerHTML = [...'789÷456×123−0.=+C←√'].map(k => `<button type="button">${k}</button>`).join('');
keys.onclick = e => { if (e.target.tagName === 'BUTTON') press(e.target.textContent); };
document.getElementById('calc').onkeydown = e => {
  const k = { '*': '×', '/': '÷', '-': '−', Enter: '=', Backspace: '←', Escape: 'C' }[e.key] || e.key;
  if (/^[\d.+=×÷−←C]$/.test(k)) { e.preventDefault(); press(k); } // preventDefault: 포커스된 버튼이 Enter로 또 눌리지 않게
};
// 그림판: 실전처럼 마우스로 끌어서 쓴다
const pad = document.getElementById('pad'), ctx = pad.getContext('2d');
ctx.lineWidth = 2;
let drawing = false;
const at = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
pad.onpointerdown = e => { drawing = true; ctx.strokeStyle = getComputedStyle(pad).color; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...at(e)); };
pad.onpointermove = e => { if (drawing) { ctx.lineTo(...at(e)); ctx.stroke(); } };
pad.onpointerup = pad.onpointercancel = () => { drawing = false; };
const wipe = () => ctx.clearRect(0, 0, pad.width, pad.height);
document.getElementById('erase').onclick = wipe;
function tools(on) {
  document.getElementById('tools').hidden = !on;
  wipe();
  press('C');
}

// 저장 상태 문구. 서버와 주고받기가 끝날 때마다 다시 쓴다
store.onsync = () => {
  const el = document.getElementById('syncstat');
  if (el) el.textContent = store.status || `서버에 저장된 기록 ${store.rows.length}건${store.outbox.length ? `, 보내는 중 ${store.outbox.length}건` : ''}`;
};

// AI 선생님: 해설 아래 버튼을 누르면 그 문제 하나를 두고 묻고 답한다. Claude API 키는 서버(Supabase 함수 skct-ask)에만 있다
const AI = 'https://jgkgacuzpoxkjuxcrjxc.supabase.co/functions/v1/skct-ask';
const asks = []; // 화면에 그린 "묻기" 버튼마다 문제와 내 답을 기억한다
const askBtn = (q, mine) => `<button type="button" class="ask" data-k="${asks.push({ q, mine }) - 1}">AI 선생님에게 묻기</button>`;
const usd = n => '$' + n.toFixed(2);
// 남은 크레딧: 서버가 답마다 토큰으로 계산해 쌓은 비용을 충전액에서 뺀 추정값
async function aiStatus(el) {
  try {
    const s = await (await fetch(AI, { headers: { 'x-skct-token': store.token } })).json();
    el.textContent = !s.ready ? 'AI 선생님: API 키가 아직 등록되지 않았습니다.' :
      `AI 크레딧 ${s.credit == null ? `사용 ${usd(s.spent)}` : `약 ${usd(s.credit - s.spent)} 남음 (충전 ${usd(s.credit)} 중 ${usd(s.spent)} 사용)`} · 오늘 ${s.today}/${s.cap}회`;
  } catch { el.textContent = ''; }
}
document.addEventListener('click', e => { const b = e.target.closest?.('.ask'); if (b) chat(b, asks[b.dataset.k]); });
function chat(btn, { q, mine }) {
  const box = document.createElement('div');
  box.className = 'chat';
  box.innerHTML = '<div></div><form><textarea rows="2" maxlength="1000" placeholder="더 궁금한 걸 물어보세요. 예: 숫자가 이렇게 바뀌면요?"></textarea><button>보내기</button></form><small></small>';
  btn.replaceWith(box);
  const [log, form, stat] = box.children, [ta, send] = form.elements;
  const msgs = []; // 앞 대화를 함께 보내 이어서 묻게 한다
  const id = crypto.randomUUID?.(); // 서버가 이 대화를 기록하는 id(같은 대화의 다음 질문은 같은 기록을 고친다)
  const say = (who, text) => { const p = document.createElement('p'); p.className = who; p.textContent = text; log.append(p); return p; };
  const ask = async text => {
    if (send.disabled) return;
    send.disabled = true;
    say('me', text);
    const out = say('ai', '생각하는 중…');
    let got = '';
    try {
      const r = await fetch(AI, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-skct-token': store.token },
        body: JSON.stringify({ q: { area: q.area, type: typeOf(q), q: q.q, choices: q.choices, answer: q.answer, explain: q.explain }, mine, chat: id, qkey: keyOf(q), messages: [...msgs, { role: 'user', content: text }] }) });
      if (!r.ok) throw new Error(await r.text());
      const rd = r.body.getReader(), dec = new TextDecoder();
      for (let c; !(c = await rd.read()).done;) { got += dec.decode(c.value, { stream: true }); out.textContent = got; }
      if (!got.trim()) throw new Error('답이 비어 있어요. 다시 보내 주세요.');
      if (!got.includes('[오류]')) msgs.push({ role: 'user', content: text }, { role: 'assistant', content: got.slice(0, 8000) }); // 오류 난 답은 대화에 넣지 않는다(다시 물을 수 있게)
    } catch (err) {
      out.textContent = got ? got + '\n\n(연결이 끊겼어요. 다시 물어봐 주세요.)' : err instanceof TypeError ? 'AI 선생님에게 연결하지 못했어요.' : err.message;
    }
    send.disabled = false;
    aiStatus(stat);
  };
  form.onsubmit = e => {
    e.preventDefault();
    const t = ta.value.trim();
    if (!t || send.disabled) return;
    if (msgs.length > 10) return say('ai', '한 문제에 6번까지 물을 수 있어요.'); // 서버가 받는 대화는 11개(질문 6, 답 5)까지
    ta.value = '';
    ask(t);
  };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send.click(); } }; // Enter 보내기, Shift+Enter 줄바꿈(한글 조합 중 Enter는 무시)
  ask('이 문제 제일 빨리 푸는 법 알려 주세요.');
}

// 지난 결과: 영역별 연습(set)과 모의고사(mock)를 회차로 묶어 점수를 보여 준다.
// 한 영역의 문제는 채점할 때 한꺼번에 기록되어 시각이 같다. 모의고사는 언어표현부터 차례로 이어지므로, 다음 순서의 영역이 오면 같은 회차로 본다
// (시간 간격으로 자르지 않는다: 일시 정지를 오래 하면 영역 사이가 벌어진다)
function pastResults() {
  const runs = [];
  let cur, lastT = 0, lastArea;
  for (const [area, type, key, ok, sec, t, , mode] of store.all().filter(r => (r[7] === 'set' || r[7] === 'mock') && AREAS.includes(r[0])).sort((a, b) => a[5] - b[5])) {
    const sameArea = cur && cur.mode === mode && lastArea === area && t - lastT <= 10;
    const nextMockArea = cur && mode === 'mock' && cur.mode === 'mock' && AREAS.indexOf(area) > AREAS.indexOf(lastArea);
    if (!sameArea && !nextMockArea) runs.push(cur = { mode, t, areas: {} });
    const a = cur.areas[area] ||= { ok: 0, n: 0, sec: 0, k: 0, wrong: [] };
    a.n++; a.ok += ok;
    if (sec != null) { a.sec += sec; a.k++; }
    if (!ok) a.wrong.push(codeOf({ area, type, _k: key }));
    lastT = t; lastArea = area;
  }
  const day = t => new Date(t * 1000).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const line = (area, a) => `${area} ${a.ok} / ${CONF[area][0]}${a.n < CONF[area][0] ? ` (시간 안에 ${a.n}문제 봄)` : ''}${a.k ? ` · 평균 ${(a.sec / a.k).toFixed(1)}초(실전 ${CONF[area][1] / CONF[area][0]}초)` : ''}`;
  scrollTo(0, 0);
  app.innerHTML = `<h1>지난 결과 (${runs.length}회)</h1><p>영역별 연습과 모의고사를 끝낼 때마다 한 회씩 쌓입니다. 점수는 "찍음"으로 표시한 문제를 틀린 것으로 센 값이라 채점 화면보다 낮을 수 있습니다. 틀린 문제 코드로 다른 Claude 세션에서 물어볼 수 있습니다.</p>` +
    (runs.length ? runs.reverse().map(run => {
      const as = AREAS.filter(a => run.areas[a]), ok = sum(as.map(a => run.areas[a].ok));
      const title = run.mode === 'mock' ? `모의고사 ${ok} / ${sum(as.map(a => CONF[a][0]))}${as.length < AREAS.length ? ` (${as.length}개 영역만)` : ''}` : line(as[0], run.areas[as[0]]);
      const wrong = as.flatMap(a => run.areas[a].wrong);
      return `<details><summary>${day(run.t)} · ${title}</summary>` + (run.mode === 'mock' ? `<p>${as.map(a => line(a, run.areas[a])).join('<br>')}</p>` : '') +
        `<p>틀린 문제 ${wrong.length}개${wrong.length ? ': ' + wrong.map(c => `<span class="code">${esc(c)}</span>`).join(' ') : ''}</p></details>`;
    }).join('') : '<p>아직 끝낸 영역별 연습이나 모의고사가 없습니다.</p>') +
    '<button id="home">처음으로</button>';
  document.getElementById('home').onclick = home;
}

// AI 선생님 기록: 자주 물어본 유형 집계와 대화 전체. 서버에서 온 글은 esc()·clean()을 거쳐 넣는다
async function aiLog() {
  scrollTo(0, 0);
  app.innerHTML = '<h1>AI 선생님 기록</h1><p>불러오는 중…</p>';
  let chats;
  try {
    const r = await fetch(AI + '?chats=1', { headers: { 'x-skct-token': store.token } });
    if (!r.ok) throw new Error(await r.text());
    chats = await r.json();
  } catch (e) {
    app.innerHTML = `<h1>AI 선생님 기록</h1><p class="no">${esc(e.message || '불러오지 못했어요.')}</p><button id="home">처음으로</button>`;
    return document.getElementById('home').onclick = home;
  }
  // 유형별: 물어본 문제 수, 그중 틀렸던 문제 수, 내가 직접 보낸 질문 수(첫 자동 질문 빼고)
  const by = {};
  for (const c of chats) {
    const v = by[c.area + ' · ' + c.type] ||= { n: 0, wrong: 0, asks: 0 };
    v.n++; if (c.mine !== c.q.answer) v.wrong++; v.asks += c.messages.filter(m => m.role === 'user').length - 1;
  }
  const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n || b[1].asks - a[1].asks);
  const mineText = c => c.mine == null ? '안 고름' : c.mine < 0 ? '모르겠음' : `${NUM[c.mine]}${c.mine === c.q.answer ? ' (정답)' : ' (오답)'}`;
  const day = t => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  app.innerHTML = `<h1>AI 선생님 기록 (${chats.length}문제)</h1>` + (chats.length ? `<h2>자주 물어본 유형</h2>` +
    `<table><tr><th>유형</th><th>물어본 문제</th><th>그중 틀린 문제</th><th>추가 질문</th></tr>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.wrong}</td><td>${v.asks}</td></tr>`).join('')}</table>` +
    `<h2>대화</h2>` + chats.map(c => `<details><summary>${day(c.updated)} · ${esc(c.area)} · ${esc(c.type)} · 내 답 ${mineText(c)} · 질문 ${c.messages.filter(m => m.role === 'user').length}개${c.qkey ? ` · <span class="code">${esc(codeOf({ area: c.area, type: c.type, _k: c.qkey }))}</span>` : ''}</summary>` +
      `<div>${clean(c.q.q)}</div><p>${c.q.choices.map((x, j) => `${NUM[j]} ${clean(x)}`).join('<br>')}</p><p>정답: ${NUM[c.q.answer]}</p>` +
      `<div class="chat">${c.messages.map(m => `<p class="${m.role === 'user' ? 'me' : 'ai'}">${esc(m.content)}</p>`).join('')}</div></details>`).join('')
    : '<p>아직 저장된 대화가 없습니다. 해설 아래 "AI 선생님에게 묻기"로 물어보면 여기에 쌓입니다.</p>') +
    '<button id="home">처음으로</button>';
  document.getElementById('home').onclick = home;
}

// 출제기가 있는 영역은 고정 문제를 절반까지 쓰고 나머지를 자동 출제로 채운다. 없는 영역(언어이해)은 고정 문제만
function build(area) {
  const gens = GEN[area] || [], count = CONF[area][0];
  const pool = QUESTIONS.filter(q => q.area === area), unseen = pool.filter(q => !store.seen.has(keyOf(q))).length;
  // 안 푼 고정 문제를 절반까지 쓰고 나머지는 자동 출제로 채운다. 출제기가 없는 영역(언어이해)은 고정 문제만 쓰며, 다 풀었으면 오래전에 푼 것부터 다시 낸다
  const qs = pickNewStatic(pool, gens.length ? Math.min(Math.floor(count / 2), unseen) : count);
  const taken = new Set(qs.map(keyOf)); // 한 세트 안에서 같은 문제가 겹치지 않게
  while (gens.length && qs.length < count) { const q = pickNew(() => gen(area), taken); taken.add(keyOf(q)); qs.push(q); }
  qs.forEach(q => console.assert(new Set(q.choices).size === 5 && q.answer >= 0 && q.answer < 5, '문제 형식 오류', q));
  return shuffle(qs);
}

// 실전 규칙대로 한 문제씩 보여 주고 이전 문항으로는 못 돌아간다.
// done이 있으면(모의고사) 채점 결과를 화면에 띄우지 않고 done(점수, 해설HTML)으로 넘긴다
function start(area, done, title = area) {
  const qs = build(area), mine = [], guessed = [], secs = [];
  const end = now() + CONF[area][1] * 1000; // 마감 시각 기준: 탭이 백그라운드로 가서 타이머가 멈춰도 시간이 맞게
  let i = 0, stop;
  const save = () => {
    const fd = new FormData(app.querySelector('form')), v = fd.get('q' + i);
    mine[i] = v === null ? null : +v;
    guessed[i] = fd.has('g' + i);
    secs[i] = stop();
  };
  const tick = () => {
    const left = Math.max(0, Math.round((end - now()) / 1000));
    document.getElementById('t').textContent = `${String(Math.floor(left / 60)).padStart(2, ' ')}:${String(left % 60).padStart(2, '0')}`;
    if (!left) { save(); grade(); }
  };
  const show = () => {
    const last = i === qs.length - 1;
    app.innerHTML = `<div id="bar"><b>${title} (${CONF[area][1] / CONF[area][0]}초) ${i + 1} / ${qs.length}</b>${CLOCK}<span id="t" role="timer"></span></div><form>${qHtml(qs[i], i, true)}` +
      `<button>${last ? (done ? '영역 종료하고 다음으로' : '종료') : '다음 문제 (되돌아갈 수 없음)'}</button></form>`;
    app.querySelector('form').onsubmit = e => { e.preventDefault(); save(); if (++i < qs.length) show(); else grade(); };
    stop = stopwatch(area);
    tools(true);
    tick();
    scrollTo(0, 0);
  };
  const grade = () => {
    clearInterval(timer);
    tools(false);
    let score = 0;
    const body = qs.map((q, k) => {
      const m = mine[k] ?? null, ok = m === q.answer;
      if (ok) score++;
      // 화면에 뜬 문제만 기록한다. 찍은 문제는 점수는 그대로 두고 기록에서만 틀린 것으로 센다
      if (secs[k] != null) store.log(q, ok && !guessed[k], secs[k], done ? 'mock' : 'set', m);
      return `<fieldset><legend class="${ok ? 'ok' : 'no'}">문제 ${k + 1} ${ok ? '정답' : '오답'}${guessed[k] ? ' (찍음)' : ''}${secs[k] != null ? ` · ${secs[k]}초` : ''} · <span class="code">${codeOf(q)}</span></legend><div>${q.q}</div>` +
        `<p>내 답: ${m === null ? '안 풂' : NUM[m] + ' ' + q.choices[m]}<br>${ansHtml(q)}</p>${askBtn(q, m)}</fieldset>`;
    }).join('');
    store.sync();
    scrollTo(0, 0);
    if (done) return done(score, body);
    app.innerHTML = `<h1>${area}: ${score} / ${qs.length}</h1>${body}<button id="home">처음으로</button>`;
    document.getElementById('home').onclick = home;
  };
  timer = setInterval(tick, 1000);
  show();
}

function mock() {
  const res = [];
  const step = i => {
    if (i < AREAS.length) return start(AREAS[i], (score, body) => { res.push({ score, body }); step(i + 1); }, `${i + 1}/${AREAS.length} ${AREAS[i]}`);
    app.innerHTML = `<h1>모의고사: ${sum(res.map(r => r.score))} / ${TOTAL}</h1>` +
      res.map((r, k) => `<details><summary>${AREAS[k]}: ${r.score} / ${CONF[AREAS[k]][0]} (해설 보기)</summary>${r.body}</details>`).join('') +
      `<button id="home">처음으로</button>`;
    document.getElementById('home').onclick = home;
  };
  step(0);
}

// 오답 목록: 문제와 보기를 보여 주고 정답·해설은 접어 둔다(먼저 풀어 보고 펼치게)
function wrongList(w) {
  app.innerHTML = `<h1>오답 목록 (${w.length})</h1>` + w.map((q, k) => `<fieldset><legend>${k + 1}. ${q.area} · ${esc(q.type)} · <span class="code">${esc(codeOf(q))}</span></legend><div>${q.q}</div>` +
    `<p>${q.choices.map((c, j) => `${NUM[j]} ${c}`).join('<br>')}</p><details><summary>정답·해설 보기</summary><p>${ansHtml(q)}</p>${askBtn(q)}</details></fieldset>`).join('') +
    `<button id="redo">다시 풀기</button><button id="home">처음으로</button>`;
  document.getElementById('redo').onclick = () => drill(w);
  document.getElementById('home').onclick = home;
  scrollTo(0, 0);
}

// list가 있으면 오답 다시 풀기: 그 문제들을 차례로 낸다
function drill(list) {
  list &&= [...list];
  const total = list?.length;
  const one = area => {
    const gens = GEN[area] || [], pool = QUESTIONS.filter(q => q.area === area);
    const unseen = pool.some(q => !store.seen.has(keyOf(q)));
    if (gens.length && (Math.random() < 0.5 || !unseen)) return pickNew(() => gen(area)); // 고정 문제와 자동 출제를 반반. 고정 문제를 다 풀었으면 자동 출제만
    return pickNewStatic(pool, 1)[0];
  };
  let n = 0, right = 0, last, pending;
  // 답한 문제는 다음으로 넘어갈 때 기록한다("찍어서 맞힘"으로 고칠 틈을 주려고)
  const flush = () => { if (pending) { store.log(pending.q, pending.ok, pending.sec, 'drill', pending.mine); store.sync(); pending = null; } };
  onpagehide = flush;
  document.onvisibilitychange = () => { if (document.hidden) flush(); }; // 아이폰은 다른 앱으로 넘어갈 때 pagehide 없이 탭을 버리기도 한다
  const next = () => {
    flush();
    if (list && !list.length) {
      document.onkeydown = null;
      tools(false);
      app.innerHTML = `<h1>오답 다시 풀기: ${right} / ${n}</h1><p>맞힌 문제는 오답 모음에서 빠졌습니다. 틀린 문제와 "찍어서 맞힘"으로 표시한 문제는 남습니다.</p><button id="home">처음으로</button>`;
      document.getElementById('home').onclick = home;
      return scrollTo(0, 0);
    }
    let q;
    if (list) q = list.shift();
    else for (let i = 0; i < 6 && (!q || typeOf(q) === last); i++) q = one(pick(AREAS)); // 같은 유형이 연달아 나오지 않게
    last = typeOf(q);
    show(q, 0);
    tools(true); // 새 문제에서만 계산기·그림판을 비운다. 다시 풀 때는 쓰던 풀이를 그대로 둔다
  };
  // 문제 하나를 띄운다. 실수로 누른 답을 무르면 같은 문제를 already초(앞서 쓴 시간)부터 다시 띄운다
  const show = (q, already) => {
    const limit = CONF[q.area][1] / CONF[q.area][0]; // 실전 문항당 시간
    let answered = false;
    app.innerHTML = `<div id="bar"><b>${list ? `오답 ${total - list.length}/${total} ` : ''}${q.area} (${limit}초)</b>${CLOCK}<span id="score">맞힌 수 ${right} / ${n}</span></div>${qHtml(q, n)}<div id="fb" aria-live="polite"><button id="submit" disabled>제출</button><button id="idk">모르겠음</button></div><button id="home">그만하기</button>`;
    const stop = stopwatch(q.area, already);
    document.getElementById('home').onclick = () => { flush(); home(); };
    document.getElementById('idk').onclick = () => answer(-1);
    const inputs = [...app.querySelectorAll('input')], sub = document.getElementById('submit');
    const chosen = () => inputs.findIndex(el => el.checked);
    const answer = j => {
      if (answered) return;
      answered = true;
      const sec = stop(), ok = j === q.answer;
      n++; if (ok) right++;
      pending = { q, ok, sec, mine: j };
      inputs.forEach(el => el.disabled = true);
      if (j >= 0) inputs[j].checked = true;
      document.getElementById('fb').innerHTML = `<p><b class="${ok ? 'ok' : 'no'}">${ok ? '정답' : j < 0 ? '모르겠음' : '오답'}</b> · ${sec}초 걸림${sec > limit ? ` (실전 기준 ${limit}초 초과)` : ''} · <span class="code">${codeOf(q)}</span><br>${ansHtml(q)}</p><button id="next">다음 문제</button>${ok ? '<button id="guess">찍어서 맞힘</button>' : ''}<button id="undo">이 문제 다시 풀기</button>${askBtn(q, j)}`;
      if (ok) document.getElementById('guess').onclick = e => {
        if (!pending) return e.target.replaceWith('이미 기록되어 바꿀 수 없습니다.'); // 화면을 떠났다 오면 이미 보낸 뒤다
        pending.ok = false; right--;
        document.getElementById('score').textContent = `맞힌 수 ${right} / ${n}`;
        e.target.replaceWith('찍음으로 기록했습니다.');
        b.focus();
      };
      // 실수로 누른 답 무르기: 아직 기록하지 않은 답이면 지우고 같은 문제를 다시 띄운다
      document.getElementById('undo').onclick = e => {
        if (!pending) return e.target.replaceWith('이미 기록되어 바꿀 수 없습니다.');
        n--; if (pending.ok) right--; // "찍어서 맞힘"을 눌렀으면 pending.ok가 이미 false이고 right도 이미 뺐다
        const spent = pending.sec;
        pending = null;
        show(q, spent);
      };
      const b = document.getElementById('next');
      b.onclick = next;
      b.focus(); // Enter로 바로 다음 문제
    };
    // 보기를 누르면 고르기만 하고, 제출을 눌러야 채점한다(잘못 누른 보기는 다시 고르면 된다)
    inputs.forEach(el => el.onchange = () => { sub.disabled = false; });
    sub.onclick = () => { if (chosen() >= 0) answer(chosen()); };
    // 1~5 = 보기 고르기(제출 버튼으로 옮겨 Enter로 낸다), 0 = 모르겠음. 계산기에 칠 때와 답한 뒤에는 무시한다
    document.onkeydown = e => {
      if (pausedAt || answered || e.target.closest?.('#tools')) return;
      if (/^[1-5]$/.test(e.key)) { inputs[e.key - 1].checked = true; sub.disabled = false; sub.focus(); }
      else if (e.key === '0') answer(-1);
      else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && chosen() >= 0) { e.preventDefault(); answer(chosen()); } // 보기를 마우스로 고른 뒤 Enter. 버튼 위 Enter는 버튼이 처리한다
    };
    scrollTo(0, 0);
  };
  next();
}

function boot() {
  home();
  store.sync().then(() => { if (document.getElementById('syncstat')) { const y = scrollY; home(); scrollTo(0, y); } }); // 서버 기록을 받아 온 뒤, 아직 첫 화면이면 보던 자리 그대로 다시 그린다
}
// 로그인 화면: 비밀번호가 맞으면 서버가 준 토큰을 이 기기에 저장하고 시작한다
function login(msg = '') {
  app.innerHTML = `<h1>SKCT 연습</h1><form id="login"><label>비밀번호 <input type="password" autocomplete="current-password" required></label>
    <button>들어가기</button><p class="no" role="alert">${msg}</p><p>이 기기에서 한 번만 넣으면 다음부터는 바로 들어가요.</p></form>`;
  const f = document.getElementById('login'), pw = f.querySelector('input'), out = f.querySelector('[role=alert]'), b = f.querySelector('button');
  pw.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    b.disabled = true;
    out.textContent = '';
    try {
      const err = await store.login(pw.value);
      if (!err) return boot();
      out.textContent = err;
      pw.select();
    } catch { out.textContent = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'; }
    b.disabled = false;
  };
}
// 살아 있는 토큰이 있으면 바로 시작. 서버에 닿지 못하면 토큰이 있는 한 그냥 시작한다(기록은 이 기기에 두었다가 나중에 보낸다)
app.textContent = '확인 중…';
store.tokenOk().then(ok => ok ? boot() : login(), () => store.token ? boot() : login('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'));
</script>
</html>
